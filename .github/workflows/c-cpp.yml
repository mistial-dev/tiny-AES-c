name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Run CI nightly (midnight)
    - cron: "0 0 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: make clean
      run: make clean
    - name: make
      run: make
    - name: make test
      run: make test
    - name: install CMake
      run: |
        if ! command -v cmake >/dev/null 2>&1; then
          apt-get update
          apt-get install -y cmake
        fi
    - name: configure CMake
      run: cmake -S . -B build
    - name: build CMake tests
      run: cmake --build build --parallel 4
    - name: run CTest
      run: ctest --test-dir build --output-on-failure

  cavp:
    name: Full CAVP corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
    - name: Run full CAVP corpus with Make
      run: make AES_CAVP=1 test
    - name: Install CMake
      run: |
        if ! command -v cmake >/dev/null 2>&1; then
          apt-get update
          apt-get install -y cmake
        fi
    - name: Configure full CAVP CMake build
      run: cmake -S . -B cavp-build -DTINY_AES_CAVP=ON
    - name: Build full CAVP CMake tests
      run: cmake --build cavp-build --parallel 4
    - name: Run full CAVP CMake tests
      run: ctest --test-dir cavp-build --output-on-failure --parallel 4
